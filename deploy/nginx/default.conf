# nginx for The Neighbor (book.icepuente.com, behind Cloudflare Tunnel): serves the static site in
# web/ and nothing else. The site has no backend, so only GET and HEAD are allowed, and no visitor
# log is kept (the privacy policy says so).
#
# scripts/serve.js (the local test server) reads the Content-Security-Policy line below, so local
# tests run under the same policy: keep it on one line.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log off;
  log_not_found off;
  client_max_body_size 1k;

  # The demo is not for search engines: remove this header (and robots.txt below) at launch.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # The account page and the dashboard of the earlier (Firebase) demo are gone.
  location ~ ^/(account|admin)\.html$ { return 301 /; }

  # The site. Pages are never cached (Cloudflare keeps that for HTML). Scripts, styles and fonts
  # are loaded from /r/<version>/..., a new path on every deploy (scripts/deploy.sh rewrites the
  # pages' links), mapped here to the real files: Cloudflare overrides "no-cache" on JS and CSS
  # with a 4-hour browser cache, so a stable path would show old code after a deploy.
  location / {
    limit_except GET { deny all; }
    expires -1;
    try_files $uri $uri/ =404;
  }
  location /r/ {
    limit_except GET { deny all; }
    expires 30d;
    rewrite ^/r/[A-Za-z0-9-]+/(.*)$ /$1 break;
  }
}
