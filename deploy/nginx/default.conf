# nginx for The Neighbor (theneighbor.dk, behind Cloudflare Tunnel): serves the static site in web/
# and passes two paths on: POST /api/request to the booking API (the `api` container, api/), and
# GET /api/address to the Danish address register (address suggestions, below). Everything else
# allows only GET and HEAD. No visitor log is kept (the privacy policy says so). The headers are in
# headers.inc, shared with the local server and the Cloudflare Pages build (scripts/build-pages.js),
# so moving hosts keeps them.

# The booking API tells visitors apart by Cloudflare's CF-Connecting-IP (cloudflared is the only way
# in from outside; Cloudflare sets the header), or the connection's address when it is missing
# (checks on the server's local port).
map $http_cf_connecting_ip $client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}
# At most 10 booking requests a minute per visitor reach the API (which itself sends at most 5 an
# hour per visitor, and 40 a day for the whole site). The zone holds addresses in memory only.
limit_req_zone $client_ip zone=api:1m rate=10r/m;
# Address lookups: about 5 a second per visitor (in memory only, never logged or passed on).
limit_req_zone $client_ip zone=address:1m rate=5r/s;

# www.theneighbor.dk -> theneighbor.dk (on Pages: a Redirect Rule, see docs/operations.md).
server {
  listen 80;
  server_name www.theneighbor.dk;
  server_tokens off;
  access_log off;
  return 301 https://theneighbor.dk$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log off;
  log_not_found off;
  client_max_body_size 1k;

  include /etc/nginx/conf.d/headers.inc;

  # The Adressevaelger token: the public sample token from its documentation, unless the server has
  # secrets/nginx/address-token.inc (not in git, kept outside deploy/) with the business's own:
  #   set $address_token "...";
  set $address_token "adressevaelger123";
  include /etc/nginx/secrets/*.inc;

  # Address suggestions (CONFIG.addressSuggest in web/js/booking-rules.js): /api/address?q=Jagtvej 10
  # asks Klimadatastyrelsen's Adressevaelger for up to 6 Danish addresses and returns its JSON
  # (fund[].titel). Only the typed text goes out: none of the visitor's headers (IP, cookies,
  # browser) are passed on, and nothing is logged or cached.
  location = /api/address {
    # The error log would hold the typed address (rate-limit and upstream-error lines quote the
    # request): log only what is critical, so nothing typed is kept (the privacy policy says so).
    error_log /dev/stderr crit;
    limit_except GET { deny all; }
    limit_req zone=address burst=10 nodelay;
    limit_req_status 429;
    if ($arg_q = "") { return 400; }
    if ($arg_q ~ ".{121}") { return 400; }
    expires -1;
    # Docker's own DNS, asked at lookup time: if the register is unreachable, only this fails.
    resolver 127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 3s;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_http_version 1.1;
    proxy_set_header Host adressevaelger.dk;
    proxy_set_header Accept application/json;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name adressevaelger.dk;
    proxy_ssl_verify on;
    # nginx checks 1 level by default; Let's Encrypt's chain here is site -> YR1 -> Root YR -> ISRG Root X1.
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 3s;
    proxy_send_timeout 4s;
    proxy_read_timeout 4s;
    # Only the JSON: the register's own headers (its CSP, HSTS, CORS, caches) are not ours to send.
    proxy_hide_header Set-Cookie;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Proxy;
    proxy_hide_header X-Varnish;
    proxy_hide_header X-Envoy-Upstream-Service-Time;
    proxy_hide_header Age;
    proxy_hide_header ETag;
    proxy_hide_header Vary;
    proxy_ignore_headers Set-Cookie Expires Cache-Control;
    proxy_pass https://adressevaelger.dk/husnumre/soeg?tekst=$arg_q&maksimum=6&token=$address_token;
  }

  # The account page and the dashboard of the earlier (Firebase) demo are gone.
  location ~ ^/(account|admin)\.html$ { return 301 /; }

  # The booking API: POST only, a body of at most 8 KB, held in memory (the buffer is as big as the
  # largest body, so a request is never written to a temporary file).
  location = /api/request {
    limit_except POST { deny all; }
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    limit_req zone=api burst=5 nodelay;
    limit_req_status 429;
    # A refused request is logged at "info", below the error log's level: no addresses in the log.
    limit_req_log_level info;
    # Looked up per request through Docker's DNS, so nginx (and the site) starts even when the api
    # container is down; the page then falls back to the visitor's mail program.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Client-IP $client_ip;
    # The API needs nothing else that identifies the visitor.
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    # Two emails, each with one retry (api/resend.js): well under 30 seconds.
    proxy_read_timeout 30s;
  }

  # The site. Pages are never cached (Cloudflare keeps that for HTML). Scripts, styles and fonts
  # are loaded from /r/<version>/..., a new path on every deploy (scripts/deploy.sh rewrites the
  # pages' links), mapped here to the real files: Cloudflare overrides "no-cache" on JS and CSS
  # with a 4-hour browser cache, so a stable path would show old code after a deploy.
  # (add_header inside a location would drop the server's headers, hence `expires` only.)
  location / {
    limit_except GET { deny all; }
    expires -1;
    try_files $uri $uri/ =404;
  }
  location /r/ {
    limit_except GET { deny all; }
    expires 30d;
    rewrite ^/r/[A-Za-z0-9-]+/(.*)$ /$1 break;
  }
}
