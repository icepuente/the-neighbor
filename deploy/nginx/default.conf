# nginx for The Neighbor (theneighbor.dk, behind Cloudflare Tunnel): serves the static site in web/
# and nothing else. The site has no backend, so only GET and HEAD are allowed, and no visitor log is
# kept (the privacy policy says so). The headers are in headers.inc, shared with the local server
# and the Cloudflare Pages build (scripts/build-pages.js), so moving hosts keeps them.

# www.theneighbor.dk -> theneighbor.dk (on Pages: a Redirect Rule, see docs/operations.md).
server {
  listen 80;
  server_name www.theneighbor.dk;
  server_tokens off;
  access_log off;
  return 301 https://theneighbor.dk$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log off;
  log_not_found off;
  client_max_body_size 1k;

  include /etc/nginx/conf.d/headers.inc;

  # The account page and the dashboard of the earlier (Firebase) demo are gone.
  location ~ ^/(account|admin)\.html$ { return 301 /; }

  # The site. Pages are never cached (Cloudflare keeps that for HTML). Scripts, styles and fonts
  # are loaded from /r/<version>/..., a new path on every deploy (scripts/deploy.sh rewrites the
  # pages' links), mapped here to the real files: Cloudflare overrides "no-cache" on JS and CSS
  # with a 4-hour browser cache, so a stable path would show old code after a deploy.
  # (add_header inside a location would drop the server's headers, hence `expires` only.)
  location / {
    limit_except GET { deny all; }
    expires -1;
    try_files $uri $uri/ =404;
  }
  location /r/ {
    limit_except GET { deny all; }
    expires 30d;
    rewrite ^/r/[A-Za-z0-9-]+/(.*)$ /$1 break;
  }
}
