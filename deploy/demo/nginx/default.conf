# nginx for the public demo (phase 7): serves web/ and passes only the emulator paths the public
# site needs to the emulators container. The emulators trust any sign-in token and accept an
# "owner" token that bypasses all rules, so this is a demo with fake data only: no real customer
# data, no email sent, wiped daily. What nginx still prevents:
# - the "Authorization: Bearer owner" bypass, anywhere;
# - the emulators' admin and UI paths (/emulator/..., the Firestore REST API, the hub);
# - large uploads and floods (size limit, per-visitor rate limit).

# Behind Cloudflare Tunnel: the visitor's address comes in CF-Connecting-IP.
map $http_cf_connecting_ip $visitor {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}
map $http_authorization $owner_token {
  "~*^bearer\s+owner\s*$" 1;
  default 0;
}
limit_req_zone $visitor zone=api:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 3m;

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # The site. Pages are never cached (Cloudflare keeps that for HTML). Scripts, styles and fonts
  # are loaded from /r/<version>/..., a new path on every deploy (scripts/deploy-demo.sh rewrites
  # the pages' links), mapped here to the real files: Cloudflare overrides "no-cache" on JS and CSS
  # with a 4-hour browser cache, so a stable path would show old code after a deploy.
  location / {
    expires -1;
    try_files $uri $uri/ =404;
  }
  location /r/ {
    expires 30d;
    rewrite ^/r/[A-Za-z0-9-]+/(.*)$ /$1 break;
  }

  # Firebase Auth emulator: sign-in and token refresh only.
  location ~ ^/(identitytoolkit|securetoken)\.googleapis\.com/ {
    if ($owner_token) { return 403; }
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://emulators:9099;
  }

  # Cloud Functions emulator: /fn/<name> -> /<project>/<region>/<name>, POST only.
  location /fn/ {
    if ($owner_token) { return 403; }
    limit_req zone=api burst=30 nodelay;
    limit_except POST { deny all; }
    rewrite ^/fn/([A-Za-z]+)$ /demo-the-neighbor/europe-west1/$1 break;
    proxy_pass http://emulators:5001;
  }

  # Cloud Storage emulator: the Firebase Storage API (uploads into uploads/{uid}/, per storage.rules).
  location /v0/b/ {
    if ($owner_token) { return 403; }
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://emulators:9199;
  }

  # Everything else the emulators offer stays private: /emulator/..., the Firestore API (the public
  # page does not use the database directly; the dashboard will, in phase 2).
  location /emulator/ { return 404; }
}
