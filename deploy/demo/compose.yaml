---
# The Neighbor demo on the home server (Proxmox LXC 114,
# /opt/the-neighbor-demo), serving book.icepuente.com through the existing
# Cloudflare Tunnel. Deployed by scripts/deploy-demo.sh.
name: the-neighbor-demo

services:
  emulators:
    build:
      context: .
      dockerfile: deploy/demo/Dockerfile.emulators
    image: the-neighbor-emulators:latest
    # The container exits after 24 hours (see the Dockerfile) and comes
    # back empty: the daily wipe.
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      # The emulator hub answers once all emulators are up.
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Local access only, for checks before and after the switch; the
    # public comes through cloudflared.
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      emulators:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Matches the owner of ./cloudflared (the deploy user) so it can read
    # the credentials.
    user: "1000:1000"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - nginx
    # Started only for the switch-over: docker compose --profile public up
    profiles: ["public"]
