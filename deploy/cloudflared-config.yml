---
# Cloudflare Tunnel for The Neighbor: the existing tunnel `bike-booking`
# (created for Spoke & Go), serving theneighbor.dk from the home server's
# nginx. Copied to cloudflared/config.yml on the server; the credentials
# file stays on the server only. Each hostname also needs a DNS record in
# Cloudflare: CNAME to 7535fdd6-afd8-4e55-9048-0ffd003888e7.cfargotunnel.com
# (proxied). book.icepuente.com was taken down at the switch.
tunnel: 7535fdd6-afd8-4e55-9048-0ffd003888e7
# yamllint disable-line rule:line-length
credentials-file: /etc/cloudflared/.cloudflared/7535fdd6-afd8-4e55-9048-0ffd003888e7.json
no-autoupdate: true

ingress:
  - hostname: theneighbor.dk
    service: http://nginx:80
  # nginx answers www with a redirect to the bare domain.
  - hostname: www.theneighbor.dk
    service: http://nginx:80
  - service: http_status:404
