<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="acc.title">The Neighbor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="demo" role="note"><span data-i18n="demo.account"></span> <a href="#" id="reset-demo" data-i18n="demo.reset"></a></div>
<header><div class="wrap">
  <a class="logo" href="index.html">The<br>Neighbor</a>
  <nav>
    <a href="index.html#private" data-i18n="nav.services"></a>
    <span class="lang" role="group" aria-label="Sprog / Language"><button type="button" id="lang-da">DA</button><button type="button" id="lang-en">EN</button></span>
    <a class="pill" href="index.html#book" data-i18n="nav.book"></a>
    <button class="pill ghost" id="out" type="button" hidden data-i18n="nav.signout"></button>
  </nav>
</div></header>

<main class="wrap page">
  <section id="login">
    <h2 id="lt" data-i18n="acc.welcome"></h2>
    <p class="sub" data-i18n="acc.lead"></p>
    <div class="seg" role="group">
      <button type="button" id="m1" aria-pressed="true" data-i18n="acc.login"></button>
      <button type="button" id="m2" aria-pressed="false" data-i18n="acc.create"></button>
    </div>
    <div class="narrow" style="margin:0 0 32px">
      <form class="box" id="lf" novalidate>
        <label for="le" data-i18n="f.email"></label><input type="email" id="le" autocomplete="email">
        <label for="lp" data-i18n="bk.password"></label><input type="password" id="lp" autocomplete="current-password">
        <p class="err" id="e-l" role="alert"></p>
        <button class="pill" type="submit" data-i18n="acc.login"></button>
        <p class="det" data-i18n="acc.forgot"></p>
      </form>
      <form class="box" id="sf" novalidate hidden>
        <label for="sn" data-i18n="f.name"></label><input type="text" id="sn" autocomplete="name">
        <div class="row">
          <div><label for="se" data-i18n="f.email"></label><input type="email" id="se" autocomplete="email"></div>
          <div><label for="sp" data-i18n="f.phone"></label><input type="tel" id="sp" autocomplete="tel"></div>
        </div>
        <label for="sw"><span data-i18n="bk.password"></span> <small data-i18n="bk.passwordSub"></small></label><input type="password" id="sw" autocomplete="new-password">
        <p class="err" id="e-s" role="alert"></p>
        <button class="pill" type="submit" data-i18n="acc.create"></button>
        <p class="det" data-i18n="acc.createNote"></p>
      </form>
    </div>
    <h3 data-i18n="acc.demoTitle"></h3>
    <div class="choice">
      <button type="button" data-demo="anna@example.com"><b data-i18n="acc.demoPrivate"></b><span data-i18n="acc.demoPrivateSub"></span></button>
      <button type="button" data-demo="hotel@example.com"><b data-i18n="acc.demoBusiness"></b><span data-i18n="acc.demoBusinessSub"></span></button>
      <button type="button" data-demo="owner@example.com"><b data-i18n="acc.demoOwner"></b><span data-i18n="acc.demoOwnerSub"></span></button>
    </div>
  </section>

  <section id="app" hidden>
    <h2 id="hi"></h2>
    <p class="sub" id="hs"></p>
    <div class="tabs" id="tabs" role="navigation"></div>
    <div id="view"></div>
  </section>
</main>

<footer class="small"><div class="wrap">The Neighbor · Rørsangervej 45, København · <a href="index.html" data-i18n="nav.home"></a></div></footer>

<script src="js/mock-backend.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/account.js"></script>
</body>
</html>
