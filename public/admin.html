<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · {{businessName}}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/admin.js" defer></script>
</head>
<body class="admin-body">
  <div class="login" id="login" hidden>
    <form class="card stack" id="login-form">
      <h1 style="font-size:1.5rem">{{businessName}} admin</h1>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <div class="alert alert-error" id="login-error" hidden></div>
      <button class="btn btn-lg" type="submit">Log in</button>
    </form>
  </div>

  <div id="app" hidden>
    <header class="admin-top">
      <div class="wrap header-inner">
        <a class="brand" href="/admin">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="20" r="5.5"/><circle cx="24" cy="20" r="5.5"/><path d="M8 20l5-9h8l3 9M13 11l3.5 9H8M21 11l-4.5 9M11 8h4M19 8h3l-1 3"/></svg>
          </span>
          <span>Bookings</span>
        </a>
        <div class="row">
          <a class="btn btn-sm btn-ghost" href="/" target="_blank">View site</a>
          <button class="btn btn-sm btn-quiet" id="logout" type="button">Log out</button>
        </div>
      </div>
    </header>

    <main class="admin-main wrap">
      <div class="alert alert-info" id="mail-warning" hidden style="margin-bottom:16px">
        Email isn't configured (SMTP_HOST is empty), so emails are only written to the server log.
      </div>

      <div class="stats" id="stats"></div>

      <div class="tabs" role="tablist" id="tabs"></div>

      <div id="view-bookings">
        <div class="toolbar">
          <input type="search" id="search" placeholder="Search name, email, phone, ref, address…" aria-label="Search bookings">
          <button class="btn btn-ghost" id="export" type="button">Export CSV</button>
        </div>
        <div class="booking-list" id="list"></div>
      </div>

      <div id="view-settings" hidden>
        <section class="card panel">
          <h2>Days off</h2>
          <p class="hint">Customers can't book on these days. Existing bookings aren't changed.</p>
          <form class="row" id="closed-form">
            <input type="date" name="date" required style="max-width:200px" aria-label="Date">
            <input name="reason" placeholder="Reason (optional, only you see it)" maxlength="200" style="flex:1;min-width:180px" aria-label="Reason">
            <button class="btn" type="submit">Add day off</button>
          </form>
          <ul class="closed-list" id="closed-list"></ul>
        </section>
      </div>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawer-title"></aside>
</body>
</html>
