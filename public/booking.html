<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Your booking · {{businessName}}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/booking.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="20" r="5.5"/><circle cx="24" cy="20" r="5.5"/><path d="M8 20l5-9h8l3 9M13 11l3.5 9H8M21 11l-4.5 9M11 8h4M19 8h3l-1 3"/></svg>
        </span>
        <span>{{businessName}}</span>
      </a>
      <nav class="nav"><a class="btn btn-sm btn-ghost" href="/#book">New booking</a></nav>
    </div>
  </header>

  <main class="page">
    <div class="wrap narrow" id="root">
      <p class="empty-state">Loading your booking…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>© {{year}} {{businessName}}</span>
      <a href="/privacy">Privacy</a>
    </div>
  </footer>
</body>
</html>
