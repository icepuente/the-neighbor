services:
  app:
    build: .
    image: bike-booking:latest
    restart: unless-stopped
    env_file:
      - .env
      - path: .env.smtp
        required: false
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    ports:
      # Local access only; the public reaches the app through cloudflared.
      - "127.0.0.1:3000:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Matches the owner of ./cloudflared (the deploy user) so it can read
    # the credentials.
    user: "1000:1000"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      app:
        condition: service_healthy
