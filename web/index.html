<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Neighbor</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="demo" id="demo-bar" hidden></div>

<div id="rules" class="dialog" role="dialog" aria-modal="true" aria-labelledby="rt" hidden>
  <div class="box">
    <h2 id="rt" data-i18n="rules.title"></h2>
    <ul id="rl"></ul>
    <button class="pill" id="rclose" type="button" data-i18n="rules.ok"></button>
  </div>
</div>

<header><div class="wrap">
  <a class="logo" href="#top">The<br>Neighbor</a>
  <nav>
    <a href="#repairs" data-i18n="nav.repairs"></a><a href="#faq" data-i18n="nav.faq"></a>
    <span class="lang" role="group" aria-label="Sprog / Language"><button type="button" id="lang-da">DA</button><button type="button" id="lang-en">EN</button></span>
    <a class="pill" href="#book" data-i18n="nav.book"></a>
  </nav>
</div></header>

<main id="top">
  <div class="wrap">
    <section class="hero">
      <div>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
      </div>
      <div class="choose">
        <a href="#book" data-pre="puncture"><div><b data-i18n="hero.puncture"></b><span id="hero-puncture-sub"></span></div><span class="go" aria-hidden="true">→</span></a>
        <a href="#repairs"><div><b data-i18n="hero.repairs"></b><span id="hero-repairs-sub"></span></div><span class="go" aria-hidden="true">→</span></a>
      </div>
    </section>
  </div>

  <section class="band" aria-label="The Neighbor"><div class="wrap">
    <ul class="points">
      <li><b data-i18n="pt.come"></b><span data-i18n="pt.comeSub"></span></li>
      <li><b data-i18n="pt.prices"></b><span data-i18n="pt.pricesSub"></span></li>
      <li><b data-i18n="pt.mail"></b><span data-i18n="pt.mailSub"></span></li>
      <li><b data-i18n="pt.one"></b><span data-i18n="pt.oneSub"></span></li>
    </ul>
  </div></section>

  <section class="sec" id="repairs"><div class="wrap">
    <h2 class="t" data-i18n="rep.title"></h2>
    <p class="sub" data-i18n="rep.sub"></p>
    <div class="prices" id="svc-cards"></div>
    <ol class="flow"><li data-i18n="how.1"></li><li data-i18n="how.2"></li><li data-i18n="how.3"></li><li data-i18n="how.4"></li></ol>

    <div id="book" class="narrow">
      <form class="box" id="f" novalidate>
        <h2 data-i18n="bk.title"></h2>
        <p class="det" data-i18n="bk.sub"></p>

        <h3 class="step"><span data-i18n="bk.what"></span> <small data-i18n="bk.whatSub"></small></h3>
        <span class="lb" id="sl" hidden data-i18n="bk.selectServices"></span>
        <button type="button" class="acc" id="sacc" aria-expanded="false" aria-controls="svcs" aria-labelledby="sl saccv"><span id="saccv" data-i18n="bk.selectServices"></span></button>
        <div id="svcs" hidden></div>
        <p class="err" id="e-services"></p>
        <label for="bike" data-i18n="bk.bike"></label><select id="bike"></select>

        <h3 class="step"><span data-i18n="bk.when"></span> <small data-i18n="bk.hours"></small></h3>
        <!-- Date fields get the site's calendar (js/datepicker.js). -->
        <label for="date" data-i18n="bk.date"></label><input type="date" id="date">
        <p class="err" id="e-date"></p>
        <!-- The start times that fit the chosen services, shown as soon as a date is chosen. -->
        <div id="times" hidden>
          <span class="lb" id="tl" data-i18n="bk.arrival"></span>
          <p class="det" data-i18n="bk.arrivalSub"></p>
          <div class="slots" id="slots" role="radiogroup" aria-labelledby="tl"></div>
        </div>
        <p class="err" id="e-arrival"></p>

        <h3 class="step" data-i18n="bk.where"></h3>
        <div class="row addr-row">
          <div><label for="street" data-i18n="bk.street"></label>
            <input type="text" id="street" autocomplete="street-address" maxlength="120" data-i18n-ph="bk.streetPh"></div>
          <div><label for="postcode" data-i18n="bk.postcode"></label>
            <input type="text" id="postcode" autocomplete="postal-code" inputmode="numeric" maxlength="4" data-i18n-ph="bk.postcodePh"></div>
        </div>
        <div class="row">
          <div><label for="name" data-i18n="f.name"></label><input type="text" id="name" autocomplete="name" maxlength="80"></div>
          <div><label for="tel" data-i18n="f.phone"></label><input type="tel" id="tel" autocomplete="tel" maxlength="30"></div>
        </div>
        <label for="note"><span data-i18n="bk.note"></span> <small data-i18n="bk.noteSub"></small></label>
        <textarea id="note" rows="3" maxlength="300" data-i18n-ph="bk.notePh"></textarea>
        <p class="err" id="e-note"></p>
        <p class="err" id="e-form" role="alert"></p>
        <button class="pill" type="submit" data-i18n="bk.seePrice"></button>
      </form>

      <div class="box" id="co" hidden>
        <h2 data-i18n="co.title"></h2>
        <p class="det" id="codet"></p>
        <table class="tbl" id="tbl"></table>
        <div id="notes"></div>
        <!-- Ticked before sending: both sentences go into the request email. The early start must be
             asked for actively (forbrugeraftaleloven § 18, stk. 2, nr. 2). -->
        <label class="cb"><input type="checkbox" id="acc-terms"><span><span data-i18n="co.acceptTerms"></span> (<a href="terms.html" target="_blank" rel="noopener" data-i18n="co.readTerms"></a>)</span></label>
        <label class="cb"><input type="checkbox" id="acc-start"><span data-i18n="co.earlyStart"></span></label>
        <p class="det"><a href="privacy.html" target="_blank" rel="noopener" data-i18n="co.privacy"></a></p>
        <p class="err" id="e-confirm" role="alert"></p>
        <a class="pill" id="send" href="#" data-i18n="co.send"></a>
        <p class="det center" data-i18n="co.sendSub"></p>
        <button class="alt" id="back" type="button" data-i18n="co.change"></button>
      </div>

      <div class="box" id="done" hidden>
        <h2 data-i18n="done.title"></h2>
        <p class="ok" id="done-msg"></p>
        <p class="det" id="done-help"></p>
        <label for="mailtext" data-i18n="done.text"></label>
        <textarea id="mailtext" rows="12" readonly></textarea>
        <button class="alt" id="copy" type="button" data-i18n="done.copy"></button>
        <span class="det" id="copied" role="status"></span>
        <div><button class="alt" id="again" type="button" data-i18n="done.again"></button></div>
      </div>
    </div>
  </div></section>

  <!-- About and FAQ -->
  <section class="band" id="faq"><div class="wrap split">
    <div>
      <h2 class="t" data-i18n="about.title"></h2>
      <p class="quote" data-i18n="about.quote"></p>
      <p class="sub" data-i18n="about.sub"></p>
    </div>
    <div class="faq">
      <details class="card"><summary data-i18n="faq.parts"></summary><p data-i18n="faq.partsA"></p></details>
      <details class="card"><summary data-i18n="faq.come"></summary><p data-i18n="faq.comeA"></p></details>
      <details class="card"><summary data-i18n="faq.hours"></summary><p data-i18n="faq.hoursA"></p></details>
      <details class="card"><summary data-i18n="faq.confirm"></summary><p data-i18n="faq.confirmA"></p></details>
      <details class="card"><summary data-i18n="faq.pay"></summary><p data-i18n="faq.payA"></p></details>
      <details class="card"><summary data-i18n="faq.data"></summary><p data-i18n="faq.dataA"></p></details>
    </div>
  </div></section>
</main>

<footer class="compact"><div class="wrap">
  <span>The Neighbor · <mark class="todo">[adresse]</mark> · <span id="foot-mail"></span> · CVR <mark class="todo">[CVR]</mark></span>
  <span><a href="terms.html" data-i18n="footer.terms"></a><a href="privacy.html" data-i18n="footer.privacy"></a></span>
</div></footer>

<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script type="module" src="js/landing.js"></script>
</body>
</html>
