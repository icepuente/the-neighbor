<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Neighbor – Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="css/style.css">

<body>
<div class="demo" role="note">Mock owner dashboard. Changes are saved only in this browser; emails go to the Outbox tab. <a href="#" id="reset-demo">Reset demo data</a></div>
<header><div class="wrap">
  <a class="logo" href="index.html">The<br>Neighbor</a>
  <nav>
    <a href="index.html">Website</a>
    <button class="pill ghost" id="out" type="button" hidden>Sign out</button>
  </nav>
</div></header>

<main class="wrap page">
  <section id="gate" hidden>
    <h2>Owner dashboard</h2>
    <p class="sub">Only the owner account can open the dashboard.</p>
    <button class="pill" id="as-owner" type="button">Sign in as the owner (demo)</button>
  </section>
  <section id="app" hidden>
    <h2>Dashboard</h2>
    <p class="sub" id="today"></p>
    <div class="tabs" id="tabs" role="navigation" aria-label="Dashboard sections"></div>
    <div id="view"></div>
  </section>
</main>

<footer class="small"><div class="wrap">The Neighbor · Owner dashboard (mock)</div></footer>

<script src="js/mock-backend.js"></script>
<script src="js/ui.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
