<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Neighbor – Dashboard</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="index.html">The<br>Neighbor</a>
  <nav>
    <a href="index.html">Website</a>
    <button class="pill ghost" id="out" type="button" hidden>Sign out</button>
  </nav>
</div></header>

<main class="wrap page">
  <!-- Sign-in: only an account with the owner (admin) claim gets past this. -->
  <section id="gate" hidden>
    <h2>Owner dashboard</h2>
    <form class="box narrow" id="signin" novalidate>
      <h3>Sign in</h3>
      <label for="email">Email</label><input type="email" id="email" autocomplete="username">
      <label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password">
      <p class="err" id="e-signin" role="alert"></p>
      <button class="pill" type="submit">Sign in</button>
      <p class="det" id="demo-login" hidden></p>
    </form>
    <div class="box narrow" id="not-owner" hidden>
      <h3>This account is not the owner</h3>
      <p>Only the owner's account can open the dashboard.</p>
    </div>
  </section>

  <section id="app" hidden>
    <h2>Dashboard</h2>
    <p class="sub" id="today"></p>
    <div class="tabs" id="tabs" role="navigation" aria-label="Dashboard sections"></div>
    <div id="view"></div>
  </section>
  <div id="loading" class="sub">Loading…</div>
</main>

<footer class="small"><div class="wrap">The Neighbor · Owner dashboard</div></footer>

<script src="js/ui.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
